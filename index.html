<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance - Data Updating</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .maintenance-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .icon-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-top-color: #38bdf8;
            border-bottom-color: #818cf8;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        .inner-icon {
            font-size: 3rem;
            color: #38bdf8;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .title {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .description {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .progress-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }

        .progress {
            height: 10px;
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.8rem;
        }

        .progress-bar {
            background: linear-gradient(90deg, #38bdf8, #6366f1);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .footer-note {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon-container">
            <div class="outer-ring"></div>
            <i class="fa-solid fa-arrows-rotate inner-icon"></i>
        </div>

        <h2 class="title">তথ্য আপডেট করা হচ্ছে</h2>
        
        <p class="description">
            আপনার তথ্য আপডেটের কাজ চলছে। অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন। কাজ সম্পন্ন হলে আপনাকে জানানো হবে।
        </p>

        <div class="progress-box">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-text">
                <span id="statusLabel">ডাটাবেজ সিঙ্ক হচ্ছে...</span>
                <span id="progressPercentage">0%</span>
            </div>
        </div>

        <div class="badge-status">
            <span class="dot"></span> সেশন সক্রিয় আছে
        </div>

        <div class="footer-note">
            <i class="fa-solid fa-shield-halved me-1"></i> এই পেজটি বন্ধ করবেন না, কাজ শেষ হলে অটো-রিডাইরেক্ট হবে।
        </div>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const progressPercentage = document.getElementById('progressPercentage');
        const statusLabel = document.getElementById('statusLabel');

        const statusMessages = [
            "ডাটাবেজ সিঙ্ক হচ্ছে...",
            "ফাইল সিকিউরিটি যাচাই করা হচ্ছে...",
            "নতুন তথ্য প্রসেস হচ্ছে...",
            "সিস্টেম কনফিগারেশন আপডেট হচ্ছে...",
            "সর্বশেষ প্রস্তুতি চলছে..."
        ];

        const interval = setInterval(() => {
            if (progress < 100) {
                progress += Math.floor(Math.random() * 5) + 1;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = progress + '%';
                progressPercentage.innerText = progress + '%';

                if (progress < 25) {
                    statusLabel.innerText = statusMessages[0];
                } else if (progress < 50) {
                    statusLabel.innerText = statusMessages[1];
                } else if (progress < 75) {
                    statusLabel.innerText = statusMessages[2];
                } else if (progress < 95) {
                    statusLabel.innerText = statusMessages[3];
                } else {
                    statusLabel.innerText = statusMessages[4];
                }
            } else {
                clearInterval(interval);
                statusLabel.innerText = "আপডেট সফলভাবে সম্পন্ন হয়েছে!";
                statusLabel.style.color = "#4ade80";
                
                // কাজ সম্পন্ন হলে অ্যাকশন নেওয়ার কোড (যেমন: নতুন পেজে রিডাইরেক্ট)
                setTimeout(() => {
                    alert("তথ্য আপডেট সম্পন্ন হয়েছে!");
                }, 500);
            }
        }, 300);
    </script>
</body>
</html>
